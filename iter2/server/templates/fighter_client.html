<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Boxing Controller</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/static/humanoid.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    :root { --f-color: {{ color }}; --mono: "Cascadia Mono", monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08090e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: rgba(18,22,34,0.9); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10; }
    .brand { font-size: 15px; font-weight: 800; color: var(--f-color); }
    .badge { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--f-color); color: var(--f-color); background: rgba(0,0,0,0.5); }
    .workspace { display: grid; grid-template-columns: 1fr 1.15fr; gap: 12px; padding: 12px; flex: 1; min-height: 0; }
    .panel { position: relative; background: #000; border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .panel.cam-view { border-color: var(--f-color); }
    .panel.ring-view { border-color: #ffd700; }
    video { display: none; }
    canvas#cam-canvas { width: 100%; height: 100%; transform: scaleX(-1); object-fit: contain; background: #000; filter: contrast(1.2) saturate(1.4) brightness(0.95); }
    #first-person-ring { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .action-hud { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.85); border: 1px solid var(--f-color); border-radius: 6px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; z-index: 5; }
    .act-title { font-size: 16px; font-weight: 900; color: var(--f-color); }
    .hit-flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,51,102,0.4); pointer-events: none; display: none; z-index: 10; }
    .move-hud { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 4px 10px; font-family: var(--mono); font-size: 10px; color: #aaa; z-index: 5; white-space: pre-line; }
    footer { padding: 6px 16px; background: rgba(18,22,34,0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; font-size: 11px; color: #888; font-family: var(--mono); }
  </style>
</head>
<body>
  <header>
    <div class="brand">{{ name }} ({{ client_id | upper }})</div>
    <div style="display: flex; gap: 8px;">
      <span class="badge" id="my-hp-badge" style="border-color:#00ff66; color:#00ff66;">HP: 100</span>
      <span class="badge" id="fps-badge">-- FPS</span>
    </div>
  </header>
  <div class="workspace">
    <div class="panel cam-view">
      <video id="webcam" playsinline></video>
      <canvas id="cam-canvas"></canvas>
      <div class="action-hud">
        <div>Motion: <span class="act-title" id="action-text">IDLE</span></div>
        <div style="color:#00ff66">Speed: <b id="speed-text">0.0</b> km/h</div>
      </div>
    </div>
    <div class="panel ring-view">
      <div class="move-hud" id="move-hud">--</div>
      <div id="first-person-ring"></div>
      <div class="hit-flash" id="hit-flash"></div>
    </div>
  </div>
  <footer>
    <div>Arrows: move/rotate | Lean: webcam move | Punch: swing fast</div>
    <div id="debug-info">--</div>
  </footer>

  <script>
    const clientId = "{{ client_id }}";
    const userColor = "{{ color }}";

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('cam-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const actionText = document.getElementById('action-text');
    const speedText = document.getElementById('speed-text');
    const fpsBadge = document.getElementById('fps-badge');
    const myHpBadge = document.getElementById('my-hp-badge');
    const hitFlash = document.getElementById('hit-flash');
    const moveHud = document.getElementById('move-hud');
    const debugInfo = document.getElementById('debug-info');

    // ========== WebSocket ==========
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${location.host}/ws/${clientId}`);
    socket.onopen = () => console.log(`[OK] Connected as ${clientId}`);
    socket.onerror = (e) => console.error("[WS ERROR]", e);
    socket.onclose = (e) => {
      console.warn("[WS CLOSED]", e.code, e.reason);
      if (e.code === 4409) showSlotRejectedOverlay(e.reason || "slot_in_use");
    };

    function showSlotRejectedOverlay(reason) {
      if (document.getElementById('slot-rejected-overlay')) return;
      const ov = document.createElement('div');
      ov.id = 'slot-rejected-overlay';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(5,7,12,0.96);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;padding:32px;text-align:center;';
      const slots = ['client_1','client_2','client_3','client_4'].filter(s => s !== clientId);
      const links = slots.map(s => `<a href="/client?id=${s}" style="color:#0ff;text-decoration:none;padding:6px 12px;border:1px solid #0ff;border-radius:4px;margin:0 4px;font-size:13px;">${s}</a>`).join('');
      ov.innerHTML = `
        <div style="font-size:56px;margin-bottom:16px;">🚫</div>
        <h1 style="font-size:26px;margin:0 0 12px;color:#ff3366;">${clientId} 슬롯이 이미 사용 중입니다</h1>
        <p style="font-size:15px;max-width:520px;line-height:1.5;color:#ccc;margin:0 0 20px;">
          다른 창/기기에서 이미 이 파이터로 접속 중입니다.<br>
          다른 슬롯을 선택하거나, 기존 세션을 닫고 다시 시도하세요.
        </p>
        <div style="margin:12px 0 20px;">${links}</div>
        <p style="font-size:12px;color:#888;font-family:monospace;">reason: ${reason}</p>
        <button onclick="location.reload()" style="margin-top:12px;padding:10px 24px;background:#0ff;color:#000;border:none;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;">다시 시도</button>`;
      document.body.appendChild(ov);
    }

    // ========== Audio ==========
    let actx = null;
    function ensureAudio() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state==="suspended") actx.resume(); return actx; }
    function playThud(freq=150) { try { const c=ensureAudio(),t=c.currentTime,o=c.createOscillator(),g=c.createGain(); o.type="sine"; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*0.4,t+0.12); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18); o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.2); } catch(e){} }
    let whooshBuf = null;
    function playWhoosh() { try { const c=ensureAudio(),t=c.currentTime; if(!whooshBuf){const sr=c.sampleRate; whooshBuf=c.createBuffer(1,sr*0.15,sr); const d=whooshBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);} const s=c.createBufferSource(); s.buffer=whooshBuf; const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1200; const g=c.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); s.connect(bp).connect(g).connect(c.destination); s.start(t); } catch(e){} }

    // ========== Three.js 1인칭 씬 ==========
    const ringContainer = document.getElementById('first-person-ring');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080a10);
    scene.fog = new THREE.Fog(0x080a10, 40, 90);

    // 배경 환경 사진 로드 (없으면 단색 유지)
    // 방식: 카메라를 감싸는 곡면(원통 안쪽) backdrop. 어떤 비율의 사진이든 자연스럽게 표시.
    let backdropMesh = null;
    const bgLoader = new THREE.TextureLoader();

    const camera = new THREE.PerspectiveCamera(68, ringContainer.clientWidth / ringContainer.clientHeight, 0.1, 1000);
    const cameraRig = new THREE.Group();
    camera.position.set(0, 0.6, 5.5);
    cameraRig.add(camera);
    scene.add(cameraRig);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(ringContainer.clientWidth, ringContainer.clientHeight);
    renderer.setPixelRatio(1);
    ringContainer.appendChild(renderer.domElement);

    // 배경 사진 실제 로드 (renderer 준비 후)
    bgLoader.load('/static/ring_bg.jpg',
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        try { tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); } catch(e) {}

        // 반경 25, 높이 35 원통 안쪽 면 (1인칭 시점 스케일 — 링에 밀착)
        const backdropGeo = new THREE.CylinderGeometry(25, 25, 35, 48, 1, true);
        const backdropMat = new THREE.MeshBasicMaterial({
          map: tex,
          side: THREE.BackSide,
          fog: false,
          depthWrite: false,
          toneMapped: false,
          color: 0x8899aa,
        });
        backdropMesh = new THREE.Mesh(backdropGeo, backdropMat);
        backdropMesh.position.y = 8;
        backdropMesh.renderOrder = -1;
        scene.add(backdropMesh);

        scene.fog = new THREE.Fog(0x080a10, 30, 80);
      },
      undefined,
      () => {}
    );

    scene.add(new THREE.AmbientLight(0x445577, 0.9));
    const spot = new THREE.SpotLight(0xffffff, 1.6); spot.position.set(0,35,0); scene.add(spot);

    // 링 바닥
    const matMesh = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x121624, roughness:0.8}));
    matMesh.rotation.x = -Math.PI/2; scene.add(matMesh);

    // 기둥 4개
    [[-18,-18],[18,-18],[18,18],[-18,18]].forEach(p => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,12), new THREE.MeshStandardMaterial({color:0xff3366}));
      pole.position.set(p[0],5,p[1]); scene.add(pole);
    });

    // 내 글러브
    const gloveMat = new THREE.MeshStandardMaterial({ color: userColor, emissive: userColor, emissiveIntensity: 0.4 });
    const myLeftGlove = new THREE.Mesh(new THREE.SphereGeometry(0.9,12,12), gloveMat);
    const myRightGlove = new THREE.Mesh(new THREE.SphereGeometry(0.9,12,12), gloveMat);
    myLeftGlove.position.set(-1.8, -1.2, -3.5);
    myRightGlove.position.set(1.8, -1.2, -3.5);
    cameraRig.add(myLeftGlove);
    cameraRig.add(myRightGlove);

    // 상대 아바타
    const worldConfigs = {
      "client_1": { pos:[-12,0,0], yaw:Math.PI/2, color:0xff3366 },
      "client_2": { pos:[12,0,0], yaw:-Math.PI/2, color:0x00e5ff },
      "client_3": { pos:[0,0,-12], yaw:0, color:0xffd700 },
      "client_4": { pos:[0,0,12], yaw:Math.PI, color:0x00ff66 }
    };
    const opponentMeshes = {};
    Object.keys(worldConfigs).forEach(id => {
      if (id === clientId) return;
      const cfg = worldConfigs[id];
      const h = window.createHumanoid(cfg.color);
      h.group.position.set(cfg.pos[0], 0, cfg.pos[2]);
      h.group.rotation.y = cfg.yaw;
      scene.add(h.group);
      opponentMeshes[id] = h;
    });

    // ========== 게임 상태 ==========
    const startConfigs = {
      "client_1": { x:-12, z:0, yaw:-Math.PI/2 },
      "client_2": { x:12, z:0, yaw:Math.PI/2 },
      "client_3": { x:0, z:-12, yaw:Math.PI },
      "client_4": { x:0, z:12, yaw:0 }
    };
    const myStart = startConfigs[clientId] || startConfigs["client_1"];
    let playerX = myStart.x;
    let playerZ = myStart.z;
    let rotationAngle = myStart.yaw;
    let lunge = 0;
    const opponentPositions = {};

    cameraRig.position.set(playerX, 5, playerZ);
    cameraRig.rotation.y = rotationAngle;

    // 키보드 (화살표 키)
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // ========== 네트워크 ==========
    function sendCombatPacket(action, vel) {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action, velocity: vel, world_x: playerX, world_z: playerZ, yaw: rotationAngle, timestamp: performance.now() }));
      }
    }

    // WebSocket 수신
    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);

      // 슬롯 중복 거부 (close 4409 직전에 서버가 보냄)
      if (data.type === "connection_rejected") {
        showSlotRejectedOverlay(data.reason || "slot_in_use");
        return;
      }

      // 내 HP & 충돌 보정
      if (data.fighters) {
        const me = data.fighters[clientId];
        if (me) {
          myHpBadge.innerText = `HP: ${me.hp}`;
          myHpBadge.style.color = me.hp > 40 ? '#00ff66' : '#ff3366';
          if (me.world_x !== undefined) playerX = me.world_x;
          if (me.world_z !== undefined) playerZ = me.world_z;
        }
      }

      // 타격
      if (data.hits && data.hits.length > 0) {
        data.hits.forEach(hit => {
          if (hit.attacker_id === clientId) {
            actionText.innerHTML = `<span style="color:#00ff66">HIT! -${hit.damage} HP</span>`;
            playThud(140);
          }
          if (hit.target_id === clientId) {
            hitFlash.style.display = 'block';
            setTimeout(() => { hitFlash.style.display = 'none'; }, 200);
            playThud(90);
          }
        });
      }

      // 상대 위치
      const senderId = data.client_id;
      if (senderId && senderId !== clientId && opponentMeshes[senderId]) {
        if (data.world_x !== undefined && data.world_z !== undefined) {
          opponentPositions[senderId] = { x: data.world_x, z: data.world_z, yaw: data.yaw !== undefined ? data.yaw + Math.PI : undefined };
        }
        opponentMeshes[senderId].setAction(data.action);
      }
    };

    // ========== MediaPipe Hands ==========
    let prevHands = {};
    let punchTargetZL = -3.5, punchTargetZR = -3.5;
    let currentAction = "IDLE", currentVelocity = 0.0;
    let lastPunchTime = 0;
    let leanX = 0, leanY = 0;
    let neutralX = 0.5, neutralY = 0.4;
    let calibFrames = 0;
    let latestHandResults = null;
    let lastDepthExt = 0, lastDepthVel = 0, lastVel3D = 0;

    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.4, minTrackingConfidence: 0.4 });

    hands.onResults((res) => {
      const now = performance.now();
      latestHandResults = res;
      let detectedAction = "IDLE";
      let maxVel = 0;
      let maxDepthExt = 0, maxDepthVel = 0;

      if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
        const handCount = res.multiHandLandmarks.length;

        for (let i = 0; i < handCount; i++) {
          const lm = res.multiHandLandmarks[i];
          const hand = res.multiHandedness[i]?.label || (i===0 ? "Right" : "Left");
          const p = prevHands[hand];
          let vel = 0, vel3D = 0, depthVel = 0, depthExt = 0;
          const wristZ = lm[0].z;
          const idxTipZ = lm[8].z;
          depthExt = wristZ - idxTipZ; // 양수 = 팔이 앞으로 뻗어짐 (카메라 기준)

          if (p && (now - p.t) > 20) {
            const dt = (now - p.t) / 1000;
            const dist = Math.hypot(lm[8].x - p.x, lm[8].y - p.y);
            vel = (dist * 1.5 / dt) * 3.6;

            // Z 깊이 변화량 (스케일링: 50배로 XY와 비슷한 크기로)
            const dz = (p.wz - wristZ) * 50;
            vel3D = (Math.sqrt(dist * dist + dz * dz) * 1.5 / dt) * 3.6;

            // 깊이 속도 (Z만)
            depthVel = (Math.abs(p.wz - wristZ) / dt) * 100;
          }
          prevHands[hand] = { x: lm[8].x, y: lm[8].y, z: lm[8].z, wz: wristZ, de: depthExt, t: now, dv: depthVel };
          if (vel3D > maxVel && vel3D < 120) maxVel = vel3D;
          if (Math.abs(depthExt) > Math.abs(maxDepthExt)) maxDepthExt = depthExt;
          if (depthVel > maxDepthVel) maxDepthVel = depthVel;

          // 3D 속도 기반 펀치 분류
          let punchType = null;
          if (vel3D > 12 && (now - lastPunchTime) > 350) {
            const absDepthExt = Math.abs(depthExt);
            if (depthVel > 3.0 && absDepthExt > 0.03) {
              punchType = (hand === "Left") ? "LEFT_HOOK" : "RIGHT_CROSS"; // 큰 Z변화 → 크로스/훅
            } else if (depthVel > 1.5) {
              punchType = (hand === "Left") ? "LEFT_JAB" : "RIGHT_UPPERCUT"; // 중간 Z변화 → 잽/어퍼컷
            } else {
              punchType = (hand === "Left") ? "LEFT_JAB" : "RIGHT_CROSS"; // 낮은 Z변화 → 기본
            }
            lastPunchTime = now; detectedAction = punchType; lunge = 0.6;
            playWhoosh(); sendCombatPacket(punchType, vel3D);
          }

          // 글러브 3D 위치 갱신 (Z 깊이 반영)
          const gloveZ = -3.5 + (depthExt * 8); // 팔 뻗을수록 앞쪽으로
          if (hand === "Left") {
            myLeftGlove.position.x = (lm[8].x - 0.5) * 4.0 - 1.5;
            myLeftGlove.position.y = (0.5 - lm[8].y) * 3.0 - 1.2;
            if (punchType) { punchTargetZL = gloveZ; }
          } else {
            myRightGlove.position.x = (lm[8].x - 0.5) * 4.0 + 1.5;
            myRightGlove.position.y = (0.5 - lm[8].y) * 3.0 - 1.2;
            if (punchType) { punchTargetZR = gloveZ; }
          }
        }

        // 손목 중점으로 lean 계산 (항상 - Pose 제거)
        let sumWx = 0, sumWy = 0;
        for (let i = 0; i < handCount; i++) {
          sumWx += res.multiHandLandmarks[i][0].x;
          sumWy += res.multiHandLandmarks[i][0].y;
        }
        const cx = sumWx / handCount;
        const cy = sumWy / handCount;

        if (calibFrames < 25) {
          neutralX += (cx - neutralX) * 0.2;
          neutralY += (cy - neutralY) * 0.2;
          calibFrames++;
        } else if (Math.abs(cx-neutralX) < 0.015 && Math.abs(cy-neutralY) < 0.015) {
          neutralX += (cx - neutralX) * 0.005;
          neutralY += (cy - neutralY) * 0.005;
        }

        leanX += ((cx - neutralX) - leanX) * 0.4;
        // Y: 앞으로 숙이면 cy 증가 → (cy - neutralY) 양수 → leanY 양수 → 전진
        leanY += ((cy - neutralY) - leanY) * 0.4;

        // 가드
        if (handCount >= 2) {
          const l0 = res.multiHandLandmarks[0][0], l1 = res.multiHandLandmarks[1][0];
          if (Math.hypot(l0.x-l1.x, l0.y-l1.y) < 0.25) detectedAction = "DUAL_GUARD";
        }

        actionText.innerText = detectedAction;
        speedText.innerText = maxVel.toFixed(1);
        currentAction = (detectedAction === "DUAL_GUARD") ? "DUAL_GUARD" : "IDLE";
        currentVelocity = maxVel;
        lastVel3D = maxVel;
        lastDepthExt = maxDepthExt;
        lastDepthVel = maxDepthVel;
      } else {
        actionText.innerText = "IDLE";
        speedText.innerText = "0.0";
        currentAction = "IDLE";
        leanX *= 0.85; leanY *= 0.85;
      }
    });

    // Camera
    let handBusy = false, lastHandT = 0;
    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        if (!videoElement || videoElement.readyState < 2) return;
        const now = performance.now();
        if (handBusy) return;
        if (now - lastHandT < 80) return; // ~12fps hands
        handBusy = true; lastHandT = now;
        try { await hands.send({image: videoElement}); } catch(e) {}
        finally { handBusy = false; }
      },
      width: 480, height: 360
    });
    cameraUtils.start();

    // 10Hz sync
    setInterval(() => { sendCombatPacket(currentAction, currentVelocity); }, 100);

    // ========== 메인 루프 (단일 rAF) ==========
    let lastFrameTime = performance.now();
    let renderFrames = 0, lastFpsTime = performance.now();
    let lastCamDraw = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min(Math.max((now - lastFrameTime) / 1000, 0.001), 0.1);
      lastFrameTime = now;

      // FPS
      renderFrames++;
      if (now - lastFpsTime >= 1000) {
        fpsBadge.innerText = `${renderFrames} FPS`;
        renderFrames = 0; lastFpsTime = now;
      }

      // === 웹캠 캔버스 (throttled 20fps) ===
      if (now - lastCamDraw >= 50) {
        lastCamDraw = now;
        if (videoElement.readyState >= 2) {
          if (canvasElement.width !== (videoElement.videoWidth||640)) {
            canvasElement.width = videoElement.videoWidth||640;
            canvasElement.height = videoElement.videoHeight||480;
          }
          canvasCtx.save();
          canvasCtx.clearRect(0,0,canvasElement.width,canvasElement.height);
          canvasCtx.drawImage(videoElement,0,0,canvasElement.width,canvasElement.height);

          // AR 네온 글로우 이펙트
          const glowIntensity = Math.min(lastVel3D / 50, 1.0); // 속도에 비례한 글로우 강도
          const glowPulse = 1 + glowIntensity * 0.6; // 펄싱 효과

          if (latestHandResults && latestHandResults.multiHandLandmarks) {
            for (let i=0; i<latestHandResults.multiHandLandmarks.length; i++) {
              const lm = latestHandResults.multiHandLandmarks[i];
              const h = latestHandResults.multiHandedness[i]?.label || "Right";
              const hColor = h==="Left"?"#00e5ff":userColor;

              // 랜드마크 네온 글로우
              canvasCtx.shadowColor = hColor;
              canvasCtx.shadowBlur = 20 + glowIntensity * 25;
              drawLandmarks(canvasCtx, lm, {
                color: '#ffffff',
                fillColor: hColor,
                radius: 4 * glowPulse,
                lineWidth: 2
              });

              // 커넥터 네온 글로우
              canvasCtx.shadowColor = hColor;
              canvasCtx.shadowBlur = 15 + glowIntensity * 15;
              drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, {
                color: hColor,
                lineWidth: 2.5 * glowPulse
              });

              canvasCtx.shadowBlur = 0; // 다음 렌더를 위해 리셋
            }
          }
          canvasCtx.restore();
        }
      }

      // === 이동 계산 ===
      let moveX = 0, moveZ = 0;

      // 키보드 화살표
      const KB_SPEED = 8;
      if (keys['ArrowUp']) {
        moveX -= Math.sin(rotationAngle) * KB_SPEED * dt;
        moveZ -= Math.cos(rotationAngle) * KB_SPEED * dt;
      }
      if (keys['ArrowDown']) {
        moveX += Math.sin(rotationAngle) * KB_SPEED * dt;
        moveZ += Math.cos(rotationAngle) * KB_SPEED * dt;
      }
      if (keys['ArrowLeft']) {
        rotationAngle += 2.5 * dt;
      }
      if (keys['ArrowRight']) {
        rotationAngle -= 2.5 * dt;
      }

      // Lean 이동 (웹캠)
      const LEAN_DEAD = 0.012;
      const LEAN_SPEED = 10;
      const LEAN_RANGE = 0.12;

      if (Math.abs(leanX) > LEAN_DEAD) {
        const intensity = Math.min((Math.abs(leanX) - LEAN_DEAD) / LEAN_RANGE, 1.0);
        const sign = leanX > 0 ? 1 : -1;
        moveX -= Math.cos(rotationAngle) * sign * intensity * LEAN_SPEED * dt;
        moveZ += Math.sin(rotationAngle) * sign * intensity * LEAN_SPEED * dt;
      }
      if (Math.abs(leanY) > LEAN_DEAD) {
        const intensity = Math.min((Math.abs(leanY) - LEAN_DEAD) / LEAN_RANGE, 1.0);
        const sign = leanY > 0 ? 1 : -1;
        moveX -= Math.sin(rotationAngle) * sign * intensity * LEAN_SPEED * dt;
        moveZ -= Math.cos(rotationAngle) * sign * intensity * LEAN_SPEED * dt;
      }

      // 펀치 lunge
      if (lunge > 0.005) {
        moveX -= Math.sin(rotationAngle) * lunge;
        moveZ -= Math.cos(rotationAngle) * lunge;
        lunge *= 0.75;
      } else { lunge = 0; }

      // 자동 회전 (좌우 화살표 미입력 시에만)
      if (!keys['ArrowLeft'] && !keys['ArrowRight']) {
        let nearDist = Infinity, nearAngle = rotationAngle;
        Object.keys(opponentPositions).forEach(id => {
          const t = opponentPositions[id];
          if (t) {
            const ddx = t.x - playerX, ddz = t.z - playerZ;
            const dist = Math.hypot(ddx, ddz);
            if (dist < nearDist) { nearDist = dist; nearAngle = Math.atan2(-ddx, -ddz); }
          }
        });
        if (nearDist < Infinity) {
          const diff = Math.atan2(Math.sin(nearAngle - rotationAngle), Math.cos(nearAngle - rotationAngle));
          rotationAngle += diff * 3.0 * dt;
        }
      }

      playerX += moveX;
      playerZ += moveZ;
      playerX = Math.max(-16, Math.min(16, playerX));
      playerZ = Math.max(-16, Math.min(16, playerZ));

      cameraRig.position.set(playerX, 5, playerZ);
      cameraRig.rotation.y = rotationAngle;

      // 펀치 회수 애니메이션
      if (punchTargetZL < -3.5) { myLeftGlove.position.z = punchTargetZL; punchTargetZL += 0.6; }
      else { myLeftGlove.position.z = -3.5; }
      if (punchTargetZR < -3.5) { myRightGlove.position.z = punchTargetZR; punchTargetZR += 0.6; }
      else { myRightGlove.position.z = -3.5; }

      // 상대 보간
      const osmooth = 1 - Math.exp(-dt * 12);
      Object.keys(opponentMeshes).forEach(id => {
        const opp = opponentMeshes[id], t = opponentPositions[id];
        if (t) {
          opp.group.position.x += (t.x - opp.group.position.x) * osmooth;
          opp.group.position.z += (t.z - opp.group.position.z) * osmooth;
          if (t.yaw !== undefined) opp.group.rotation.y += (t.yaw - opp.group.rotation.y) * osmooth;
        }
        opp.update();
      });

      // HUD - 디버그 정보 표시
      const lxP = (leanX*100).toFixed(1), lyP = (leanY*100).toFixed(1);
      const cal = calibFrames < 25 ? `CAL ${calibFrames}/25` : "OK";
      const handsOk = latestHandResults && latestHandResults.multiHandLandmarks && latestHandResults.multiHandLandmarks.length > 0;
      moveHud.innerText = `Lean: ${lxP}%,${lyP}% [${cal}]\nPos: ${playerX.toFixed(1)},${playerZ.toFixed(1)}\nHands: ${handsOk ? latestHandResults.multiHandLandmarks.length : 'none'} | V3D:${lastVel3D.toFixed(1)}\nZ-ext:${lastDepthExt.toFixed(3)} Z-vel:${lastDepthVel.toFixed(1)}`;
      debugInfo.innerText = `move: ${moveX.toFixed(4)},${moveZ.toFixed(4)} | rot: ${rotationAngle.toFixed(2)} | lunge: ${lunge.toFixed(3)}`;

      renderer.render(scene, camera);
    }
    animate(performance.now());

    window.addEventListener('resize', () => {
      camera.aspect = ringContainer.clientWidth / ringContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(ringContainer.clientWidth, ringContainer.clientHeight);
    });
  </script>
</body>
</html>
