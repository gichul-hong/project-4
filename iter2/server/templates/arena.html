<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥊 4-Player AR Shadow Boxing & Battle Arena (Host View)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #07080d;
      --panel: rgba(15, 18, 28, 0.85);
      --red: #ff3366;
      --cyan: #00e5ff;
      --gold: #ffd700;
      --green: #00ff66;
      --font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      --mono: "Cascadia Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: var(--font);
      overflow: hidden;
      user-select: none;
    }
    #arena-canvas {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
    }

    /* Top HUD: 4-Player Health Bars */
    .hud-top {
      position: absolute;
      top: 16px; left: 20px; right: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      z-index: 10;
      pointer-events: none;
    }
    .fighter-card {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      transition: all 0.2s;
    }
    .fighter-card.active { border-color: var(--f-color); }
    .fighter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--f-color);
    }
    .hp-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      background: var(--f-color);
      width: 100%;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 10px var(--f-color);
    }
    .action-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* Center Combat Feed */
    .hit-banner {
      position: absolute;
      top: 18%; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      border: 2px solid var(--red);
      border-radius: 10px;
      padding: 12px 28px;
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      display: none;
      z-index: 15;
      text-shadow: 0 0 15px var(--red);
      animation: popHit 0.3s ease;
    }
    @keyframes popHit {
      0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }

    /* Bottom Status Bar */
    .hud-bottom {
      position: absolute;
      bottom: 20px; left: 20px; right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }
    .system-stats {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }
    .btn-numbers {
      background: linear-gradient(135deg, var(--red), #ff6b00);
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      pointer-events: auto;
      box-shadow: 0 4px 15px rgba(255,51,102,0.4);
    }
  </style>
</head>
<body>
  <div id="arena-canvas"></div>

  <!-- 4-Player HP HUD -->
  <div class="hud-top">
    <div class="fighter-card" id="card-client_1" style="--f-color: var(--red);">
      <div class="fighter-head"><span>🥊 User 1 (Red)</span><span id="hp-text-client_1">100 HP</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar-client_1"></div></div>
      <div class="action-badge"><span>Action:</span><b id="act-client_1">IDLE</b></div>
    </div>
    <div class="fighter-card" id="card-client_2" style="--f-color: var(--cyan);">
      <div class="fighter-head"><span>🥊 User 2 (Cyan)</span><span id="hp-text-client_2">100 HP</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar-client_2"></div></div>
      <div class="action-badge"><span>Action:</span><b id="act-client_2">IDLE</b></div>
    </div>
    <div class="fighter-card" id="card-client_3" style="--f-color: var(--gold);">
      <div class="fighter-head"><span>⚡ User 3 (Gold)</span><span id="hp-text-client_3">100 HP</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar-client_3"></div></div>
      <div class="action-badge"><span>Action:</span><b id="act-client_3">IDLE</b></div>
    </div>
    <div class="fighter-card" id="card-client_4" style="--f-color: var(--green);">
      <div class="fighter-head"><span>🥊 User 4 (Green)</span><span id="hp-text-client_4">100 HP</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar-client_4"></div></div>
      <div class="action-badge"><span>Action:</span><b id="act-client_4">IDLE</b></div>
    </div>
  </div>

  <!-- Impact Hit Banner -->
  <div class="hit-banner" id="hit-banner">💥 CRITICAL HIT! -25 HP</div>

  <!-- Bottom HUD -->
  <div class="hud-bottom">
    <div class="system-stats">
      <div>🚀 <b>Live FPS</b>: <span id="stat-fps" style="color:var(--green)">60</span> | <b>GPU Motion Model</b>: <span style="color:var(--cyan)">Bi-LSTM (PyTorch)</span></div>
      <div>🥊 <b>Engine</b>: Real-time Kinematics & Hitbox Collision Detection</div>
    </div>
    <button class="btn-numbers" onclick="showNumbersReport()">📊 Show Numbers (GPU 학습 지표)</button>
  </div>

  <script>
    // --- 1. Three.js 3D 사이버펑크 복싱 링 아레나 구축 ---
    const container = document.getElementById('arena-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07080d);
    scene.fog = new THREE.FogExp2(0x07080d, 0.015);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 35, 55);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // 조명
    scene.add(new THREE.AmbientLight(0x334466, 0.8));
    const ringLight = new THREE.SpotLight(0xffffff, 2.0);
    ringLight.position.set(0, 50, 0);
    ringLight.angle = Math.PI / 3;
    ringLight.castShadow = true;
    scene.add(ringLight);

    // 복싱 링 바닥 (Neon Mat)
    const matGeo = new THREE.BoxGeometry(40, 2, 40);
    const matMat = new THREE.MeshStandardMaterial({ color: 0x111420, roughness: 0.8 });
    const ringMat = new THREE.Mesh(matGeo, matMat);
    ringMat.position.y = -1;
    ringMat.receiveShadow = true;
    scene.add(ringMat);

    // 링 로프 기둥 4개 & 네온 로프
    const cornerPositions = [[-18, -18], [18, -18], [18, 18], [-18, 18]];
    cornerPositions.forEach(pos => {
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 0.6, 12),
        new THREE.MeshStandardMaterial({ color: 0xff3366, metalness: 0.8 })
      );
      pole.position.set(pos[0], 5, pos[1]);
      scene.add(pole);
    });

    // --- 2. 4인 3D 파이터 아바타 생성 ---
    const fighterConfigs = {
      "client_1": { color: 0xff3366, pos: [-12, 4, 0] },
      "client_2": { color: 0x00e5ff, pos: [12, 4, 0] },
      "client_3": { color: 0xffd700, pos: [0, 4, -12] },
      "client_4": { color: 0x00ff66, pos: [0, 4, 12] }
    };

    const fighterMeshes = {}; // { client_id: { group, head, body, leftGlove, rightGlove, shield } }

    Object.keys(fighterConfigs).forEach(cid => {
      const cfg = fighterConfigs[cid];
      const group = new THREE.Group();

      // 몸통
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(1.8, 1.2, 5, 8),
        new THREE.MeshStandardMaterial({ color: 0x222633, roughness: 0.5 })
      );
      body.position.y = 2.5;
      group.add(body);

      // 머리 (헤드기어)
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(1.5, 16, 16),
        new THREE.MeshStandardMaterial({ color: cfg.color, metalness: 0.5, roughness: 0.3 })
      );
      head.position.y = 6.2;
      group.add(head);

      // 정면 고글 바이저 (캐릭터가 바라보는 앞쪽 표시)
      const visor = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.4, 0.6),
        new THREE.MeshBasicMaterial({ color: cfg.color })
      );
      visor.position.set(0, 6.2, 1.3);
      group.add(visor);

      // 양손 글러브 (가슴 앞 정면 위치: +z 방향)
      const gloveMat = new THREE.MeshStandardMaterial({ color: cfg.color, emissive: cfg.color, emissiveIntensity: 0.4 });
      const leftGlove = new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 16), gloveMat);
      const rightGlove = new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 16), gloveMat);
      leftGlove.position.set(-2.2, 3.5, 2.0);
      rightGlove.position.set(2.2, 3.5, 2.0);
      group.add(leftGlove);
      group.add(rightGlove);

      // 가드 실드 (홀로그램)
      const shieldGeo = new THREE.SphereGeometry(3.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const shieldMat = new THREE.MeshBasicMaterial({ color: cfg.color, wireframe: true, transparent: true, opacity: 0 });
      const shield = new THREE.Mesh(shieldGeo, shieldMat);
      shield.rotation.x = Math.PI / 2;
      shield.position.y = 4;
      group.add(shield);

      // 위치 및 링 중앙(0, 4, 0) 정면 마주보기 설정 (Three.js Object3D는 +z가 타겟을 향함)
      group.position.set(cfg.pos[0], 0, cfg.pos[2]);
      group.lookAt(0, 4, 0);
      scene.add(group);

      fighterMeshes[cid] = { group, head, body, leftGlove, rightGlove, shield };
    });

    // 펀치 타격 광선 이펙트 (Punch Laser Beam)
    function spawnPunchTrail(startPos, colorHex) {
      const dir = new THREE.Vector3(0, 4, 0).sub(startPos).normalize();
      const endPos = startPos.clone().addScaledVector(dir, 15);
      const geom = new THREE.BufferGeometry().setFromPoints([startPos, endPos]);
      const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3, transparent: true, opacity: 1.0 });
      const line = new THREE.Line(geom, mat);
      scene.add(line);

      let op = 1.0;
      const fade = setInterval(() => {
        op -= 0.15;
        line.material.opacity = op;
        if (op <= 0) {
          clearInterval(fade);
          scene.remove(line);
        }
      }, 30);
    }

    // --- 3. WebSocket 실시간 연동 ---
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${window.location.host}/ws/host_arena`);

    socket.onopen = () => console.log("[✓] Arena WebSocket connected");

    let shakeDuration = 0;

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);

      // 1. 파이터 HP & 액션 UI 갱신
      if (data.fighters) {
        Object.keys(data.fighters).forEach(cid => {
          const f = data.fighters[cid];
          const bar = document.getElementById(`hp-bar-${cid}`);
          const text = document.getElementById(`hp-text-${cid}`);
          const act = document.getElementById(`act-${cid}`);
          if (bar && text && act) {
            bar.style.width = `${f.hp}%`;
            text.innerText = `${f.hp} HP`;
            act.innerText = f.action;
          }
        });
      }

      const cid = data.client_id;
      const mesh = fighterMeshes[cid];
      if (!mesh) return;

      const action = data.action;
      const basePos = fighterConfigs[cid]?.pos || [0, 4, 0];

      // 2. 실시간 풋워크 3D 위치 이동 동기화 (로컬 전진/사이드스텝 -> 월드 벡터 변환)
      if (data.pos_x !== undefined && data.pos_z !== undefined) {
        const strafe = data.pos_x;     // 좌우 스텝 (+: 우측, -: 좌측)
        const forward = -data.pos_z;   // 전진 (+: 링 중앙으로 전진, -: 후퇴)

        // 코너에서 링 중앙(0, 0)을 향하는 단위 벡터 계산
        const centerDir = new THREE.Vector2(-basePos[0], -basePos[2]).normalize();
        const rightDir = new THREE.Vector2(centerDir.y, -centerDir.x); // 우측 수직 벡터

        // 월드 타겟 위치 계산
        const targetX = basePos[0] + (centerDir.x * forward) + (rightDir.x * strafe);
        const targetZ = basePos[2] + (centerDir.y * forward) + (rightDir.y * strafe);

        mesh.group.position.x = THREE.MathUtils.lerp(mesh.group.position.x, targetX, 0.5);
        mesh.group.position.z = THREE.MathUtils.lerp(mesh.group.position.z, targetZ, 0.5);
        mesh.group.lookAt(0, 4, 0); // 항상 링 중앙을 주시

        // 상단 HUD에 액션 & 실시간 위치 표시
        const actBadge = document.getElementById(`act-${cid}`);
        if (actBadge) {
          actBadge.innerText = `${action} (X:${mesh.group.position.x.toFixed(1)}, Z:${mesh.group.position.z.toFixed(1)})`;
        }
      }

      // 3. 양손 펀치 & 가드 3D 애니메이션 연출 (+z가 정면 링 중앙 방향)
      if (action === "RIGHT_CROSS" || action === "JAB_STRAIGHT" || action === "RIGHT_UPPERCUT") {
        mesh.rightGlove.position.z = 7.0; // 링 중앙으로 돌진!
        spawnPunchTrail(mesh.group.position.clone().add(new THREE.Vector3(2.2, 3.5, 2.0)), fighterConfigs[cid].color);
        setTimeout(() => { mesh.rightGlove.position.z = 2.0; }, 180);
      } else if (action === "LEFT_JAB" || action === "LEFT_HOOK") {
        mesh.leftGlove.position.z = 7.0; // 링 중앙으로 돌진!
        spawnPunchTrail(mesh.group.position.clone().add(new THREE.Vector3(-2.2, 3.5, 2.0)), fighterConfigs[cid].color);
        setTimeout(() => { mesh.leftGlove.position.z = 2.0; }, 180);
      } else if (action === "DUAL_GUARD" || action === "TWO_HAND_GUARD") {
        mesh.shield.material.opacity = 0.85;
        setTimeout(() => { mesh.shield.material.opacity = 0; }, 350);
      }

      // 4. 타격 피격 & 화면 흔들림(Camera Shake)
      if (data.hits && data.hits.length > 0) {
        const hit = data.hits[0];
        shakeDuration = 14; // 화면 흔들림

        const banner = document.getElementById('hit-banner');
        banner.innerText = hit.is_guard ? `🛡️ GUARD! DEFLECTED (-${hit.damage} HP)` : `💥 CRITICAL HIT! -${hit.damage} HP (${data.velocity ? data.velocity.toFixed(1) : '38'} km/h)`;
        banner.style.display = 'block';
        setTimeout(() => { banner.style.display = 'none'; }, 900);
      }
    };

    // --- 4. 렌더 루프 ---
    let frameCount = 0, lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      // FPS 측정
      frameCount++;
      if (now - lastTime >= 1000) {
        document.getElementById('stat-fps').innerText = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      // 화면 흔들림 (Camera Shake Effect)
      if (shakeDuration > 0) {
        camera.position.x += (Math.random() - 0.5) * 1.5;
        camera.position.y += (Math.random() - 0.5) * 1.5;
        shakeDuration--;
      }

      // 파이터들 바운스 리듬
      Object.keys(fighterMeshes).forEach(cid => {
        const f = fighterMeshes[cid];
        f.head.position.y = 6.2 + Math.sin(now * 0.006) * 0.15;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate(performance.now());

    function showNumbersReport() {
      fetch('/api/motion-eval')
        .then(r => r.json())
        .then(data => {
          alert(`📊 [Show Numbers - GPU 딥러닝 모션 분류 지표]\n\n` +
            `• 학습 디바이스: ${data.device}\n` +
            `• 정적 2D 키포인트 베이스라인: ${(data.rule_based_accuracy * 100).toFixed(1)}%\n` +
            `• 시계열 Bi-LSTM (GPU 학습): ${(data.lstm_accuracy * 100).toFixed(1)}%\n` +
            `• 정확도 향상: +${data.improvement_pct_points.toFixed(1)}%p 달성!\n` +
            `• 15 Epochs 학습 시간: ${data.training_time_seconds.toFixed(2)}초`);
        });
    }
  </script>
</body>
</html>
